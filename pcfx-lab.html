<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PCFX Particle Lab</title>
  <link rel="icon" href="data:," />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #101216;
      color: #e5e7eb;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #application-canvas {
      display: block;
      width: 960px;
      height: 540px;
    }
    #panel {
      padding: 10px 14px;
      font-size: 12.5px;
      line-height: 1.5;
      max-width: 932px;
    }
    #panel a { color: #93c5fd; margin-right: 10px; }
    #panel code, #report { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    #legend span { display: inline-block; width: 108px; text-align: center; color: #9ca3af; }
    #report {
      white-space: pre-wrap;
      font-size: 11.5px;
      color: #6ee7b7;
      background: #0b0d10;
      padding: 8px;
      border-radius: 6px;
      max-height: 300px;
      overflow: auto;
    }
    #error-overlay { display: none; color: #fecaca; background: #7f1d1d; padding: 8px; white-space: pre-wrap; font-family: ui-monospace, monospace; }
  </style>
  <script>
    window.__pcfxErrors = [];
    window.addEventListener('error', (e) => {
      window.__pcfxErrors.push(String(e.message));
      const box = document.getElementById('error-overlay');
      if (box) { box.style.display = 'block'; box.textContent += `[ERROR] ${e.message}\n`; }
    });
    window.addEventListener('unhandledrejection', (e) => {
      window.__pcfxErrors.push(String(e.reason && e.reason.stack ? e.reason.stack : e.reason));
      const box = document.getElementById('error-overlay');
      if (box) { box.style.display = 'block'; box.textContent += `[PROMISE ERROR] ${e.reason}\n`; }
    });
  </script>
  <script type="module" crossorigin src="./assets/pcfxLab-C09YUPxd.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/install-Dzl-iPxZ.js">
</head>
<body>
  <canvas id="application-canvas" width="960" height="540"></canvas>
  <div id="panel">
    <div id="legend"></div>
    <p>
      <a href="?pcfx=on">pcfx on</a>
      <a href="?pcfx=off">pcfx off</a>
      <a href="?pcfx=on&amp;neutral=1">on, neutral settings</a>
      <a href="?pcfx=on&amp;frames=120">fixed 120 frames</a>
      <a href="?pcfx=on&amp;device=webgpu">WebGPU</a>
    </p>
    <p>Dashed line = kill-plane height (world Y 2; the NaN effect falls back to Y 0). Particles below the line should be gone when pcfx is on, except in the <code>cpu-sorted</code> and <code>throws</code> cells, which are expected to fall back to stock.</p>
    <div id="error-overlay"></div>
    <div id="report">Starting...</div>
  </div>
</body>
</html>
